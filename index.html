  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Informer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:      #6B3FA0;
      --purple-l:    #9B6FD0;
      --purple-dim:  rgba(107,63,160,0.08);
      --pink:        #ed3572;
      --pink-d:      #c82c60;
      --bg:          #f0ebf8;
      --surface:     #ffffff;
      --text:        #1a1a2e;
      --muted:       #7a7090;
      --border:      rgba(107,63,160,0.15);
      --user-bg:     #ede8f8;
      --bot-bg:      #f9f7fc;
      --radius:      18px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(107,63,160,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(237,53,114,0.08) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 28px 24px 16px;
      text-align: center;
    }

    .header h1 {
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 700;
      font-style: italic;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .chips {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 20px 16px;
    }

    .suggestion {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--purple);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(107,63,160,0.08);
    }

    .suggestion:hover {
      background: var(--purple);
      color: #fff;
      border-color: var(--purple);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(107,63,160,0.25);
    }
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: min(720px, 94%);
      margin: 0 auto;
      min-height: 0;
    }

    #chatBody {
      flex: 1;
      min-height: 200px;
      max-height: calc(100vh - 320px);
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 24px rgba(107,63,160,0.08);
    }

    #chatBody::-webkit-scrollbar { width: 4px; }
    #chatBody::-webkit-scrollbar-track { background: transparent; }
    #chatBody::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message {
      max-width: 75%;
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background: linear-gradient(135deg, var(--purple), var(--purple-l));
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      background: var(--bot-bg);
      color: var(--text);
      align-self: flex-start;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .typing-indicator { align-self: flex-start; padding: 12px 16px; }
    .typing-dots { display: flex; gap: 5px; }
    .typing-dot {
      width: 7px; height: 7px;
      background: var(--purple-l);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform: scale(0.7); opacity: 0.4; }
      40%          { transform: scale(1);   opacity: 1; }
    }
    .chat-footer {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px 0 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    }

    .chat-footer input {
      flex: 1;
      padding: 13px 18px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      border-radius: 50px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      outline: none;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
      box-shadow: 0 2px 8px rgba(107,63,160,0.06);
    }

    .chat-footer input:focus {
      border-color: var(--purple-l);
      box-shadow: 0 0 0 3px rgba(107,63,160,0.12);
    }

    .chat-footer input::placeholder { color: var(--muted); }

    .btn-icon {
      width: 46px; height: 46px;
      border: none; border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      position: relative;
    }

    #sendBtn {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      box-shadow: 0 4px 14px rgba(107,63,160,0.35);
    }
    #sendBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(107,63,160,0.45);
    }

    #deleteBtn {
      background: var(--surface);
      color: var(--muted);
      border: 1.5px solid var(--border);
    }
    #deleteBtn:hover {
      background: #fff0f4;
      color: var(--pink);
      border-color: var(--pink);
    }
    .btn-icon::after {
      content: attr(title);
      position: absolute;
      bottom: 54px;
      background: var(--text);
      color: #fff;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .btn-icon:hover::after { opacity: 1; }
    @media (max-width: 600px) {
      .suggestion { font-size: 12px; padding: 8px 14px; }
      .message { max-width: 88%; font-size: 13px; }
      .btn-icon::after { display: none; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Informer</h1>
    <p>Your intelligent assistant — ask me anything</p>
  </div>

  <div class="chips">
    <div id="b1" class="suggestion">💬 English communication tips</div>
    <div id="b2" class="suggestion">🚀 Best language to learn</div>
    <div id="b3" class="suggestion">🎓 Internship suggestions</div>
  </div>

  <div class="chat-wrap">
    <div id="chatBody"></div>

    <div class="chat-footer">
      <button id="deleteBtn" class="btn-icon" title="Clear chat">🗑️</button>
      <input type="text" id="userInput" placeholder="Message Informer…" autocomplete="off"/>
      <button id="sendBtn" class="btn-icon" title="Send">➤</button>
    </div>
  </div>

  <script src="fetch.js"></script>
  <script>
    document.getElementById("deleteBtn").addEventListener("click", function () {
      chatHistory = [];
      try { localStorage.removeItem("chatHistory"); } catch(e) {}
      chatHistory.push({ role: "bot", text: "Hi! I'm Informer. How can I assist you today?" });
      displayChat();
    });
  </script>
</body>
</html>
